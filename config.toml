# ============================================================
#  本地知识库配置
#  改完直接重跑 ingest.py 即可，无需改代码。
#  chunk 这几个数字是你后续做对照实验的旋钮，别拍脑袋定死。
# ============================================================

[path]
raw_dir = "data/raw"          # git clone 下来的语料仓库都放这里
out_dir = "data/processed"    # 切块结果 JSONL + stats.json

[chunk]
max_chars = 1200    # 单块目标上限（字符）。中文 1200 字约 1200 token
min_chars = 120      # 低于此值的块，尝试与同父标题的相邻块合并
drop_below = 40     # 合并后仍低于此值则丢弃（通常是残留占位）
overlap = 120       # 超长章节二次切分时，块首补上的上文字符数
code_block_max_chars = 2400   # 代码块超过此值就在空行处拆开
                              # （实测 self-llm 里有 56KB 的 base64 示例代码块，
                              #   不拆的话既超嵌入上下文又永远检索不到）

[filter]
# 这些目录里的 Markdown 对检索没有价值，直接跳过
skip_dirs = [
  ".git", ".github", ".vuepress", ".idea", ".vscode",
  "node_modules", "assets", "images", "img", "static",
  "public", "media", "fonts", "dist", "build",
]

# 文件名（小写、含扩展名）命中则跳过
skip_files = [
  "license", "license.md", "changelog", "changelog.md",
  "contributing.md", "code_of_conduct.md", "notice",
]

# ============================================================
#  集合（collection）：物理隔离的单位
#  每个集合有自己的 raw_dir / index_dir / parser，互不读写。
#
#  入  库：python ingest.py ingest  --collection profile
#          python ingest.py ingest  --collection profile --dry-run
#  建索引：python ingest.py index   --collection profile
#  查  询：python ingest.py search  "项目经历" --collection tech,profile
#  删  除：python ingest.py drop    --collection profile --path xxx.pdf
#
#  parser：markdown=只认 .md / pdf=只认 .pdf / auto=按扩展名分派
#  generation：disabled 表示该集合不走云端生成，只返回检索原文（隐私用，
#              由 Phase 4/5 读取；Phase 1 只是把它存下来）
#  weight：跨集合 RRF 融合时这一路的权重，默认 1.0
#
#  注意：tech 的 index_dir 仍然是 data/index（现有 18,276 块的索引原地不动），
#        新集合各自用 data/index/<name>/。没有 [collections] 段时等价于
#        只有一个 tech、raw_dir="data/raw"、index_dir="data/index"。
# ============================================================

[collections]
default_search = ["tech"]        # search 不写 --collection 时查哪些集合（逗号分隔亦可）

[collections.tech]
raw_dir = "data/raw/tech"        # 技术文档（JavaGuide / CS-Notes / ... 在下一层）
index_dir = "data/index"         # 沿用现有索引，不迁移、不重建
parser = "markdown"

[collections.papers]
raw_dir = "data/raw/papers"
index_dir = "data/index/papers"
parser = "auto"

[collections.profile]
raw_dir = "data/raw/profile"
index_dir = "data/index/profile"
parser = "auto"
generation = "disabled"          # 隐私：简历不走云端生成，只返回检索原文

# ============================================================
#  Phase 2 · 检索
#  建索引：python ingest.py index --chunks <chunks.jsonl>
#  查  询：python ingest.py search "查询词"
# ============================================================

[retrieval]
index_dir = "data/index"                  # 索引输出目录（相对项目根）
model_dir = "models/bge-m3"               # bge-m3 ONNX 目录；留空 "" 表示没有
reranker_dir = "models/bge-reranker-base" # 留空则 --rerank 自动跳过

# 批大小对速度影响极大，但方向和直觉相反：
#   CPU      上 16 比 1 快 3~5 倍
#   DirectML 上 4 最快（实测 7.6 块/秒），16 反而降到 5.6 —— 4GB 显存塞不下更大的批
embed_batch_size = 4     # 用显卡时取 4；只有 CPU 时改成 16
embed_max_length = 512   # bge-m3 支持 8192，但 CPU 上一次 8192 要几十秒

# 各路召回多少条，融合后留多少，最终返回多少
dense_top_k = 50         # 稠密那一路的候选数
sparse_top_k = 50        # BM25 那一路的候选数
fusion_top_k = 50        # RRF 融合后进入重排的候选数（交叉编码器成本正比于此）
final_top_k = 10         # 默认返回条数，可被 search --top-k 覆盖
rrf_k = 60               # RRF 平滑常数，论文推荐 60
use_reranker = false     # 默认不重排：CPU 上重排 50 条要 2~5 秒

# ============================================================
#  Phase 4 · 生成（检索 -> 大模型 -> 带引用的答案）
#  问  答：python ingest.py ask "HashMap 什么时候转红黑树"
#  密钥：环境变量 / 项目根 .env / Windows 注册表，三选一即可，
#        配置文件里只写变量名，永远不写 key 本身。
# ============================================================

[generate]
model = "deepseek-chat"
base_url = "https://api.deepseek.com/chat/completions"
api_key_env = "DEEPSEEK_API_KEY"   # 只放变量名，不放 key

temperature = 0.1
max_tokens = 1024

# 上下文预算：单块先截到 1500 字，所有块加起来不超过 6000 字，
# 超了就按排名丢掉后面的块（提示词里会说明截断到前 N 条）
max_context_chars = 6000
max_chunk_chars = 1500

top_k = 5              # 送进提示词的块数上限，可被 ask --top-k 覆盖

# 0 = 关闭。只在单路检索（--no-dense 或 --no-sparse）下有意义：
# 混合检索的 score 是 RRF 融合分（约 0.016~0.033），和余弦相似度不在一个
# 量纲上，用它当绝对阈值会把所有查询都拒掉。代码在 source=hybrid 时显式跳过。
min_top_score = 0

timeout = 60           # 单次请求超时（秒）

# ============================================================
#  Phase 5 · Web 界面
#  启  动：python ingest.py web
#         python ingest.py web --port 8123 --no-browser
#  编辑器：editor 留空 = 自动探测（先找 code，能跳到行；再退到 notepad）
#          code 不在 PATH 上时，这里可以写 code.cmd 的绝对路径，
#          或者启动时用 --editor "D:\...\bin\code.cmd"
#  语料根目录不在这里配，统一用 [path].raw_dir；临时换目录用 --raw-dir
# ============================================================

[web]
host = "127.0.0.1"
port = 8000
editor = ""            # 留空 = 自动探测 code -> notepad

# 「今日复习」的题库：一次评测的结果 JSON（相对项目根目录，绝对路径也认）。
# 题目取自 per_query 里前 5 条没命中的条目，按日期轮换。留空 = 关掉入口。
review_file = "results/run_hybrid.json"
