<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地知识库</title>
<style>
  /* 颜色全部走 CSS 变量：切主题只改 html[data-theme]，不动任何规则。
     JS 在启动时把 auto 解析成 light / dark 再写进 data-theme。 */
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --border-strong: #cfd5dd;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-weak: #eef3ff;
    --ok: #067647;
    --bad: #b42318;
    --bad-bg: #fef3f2;
    --bad-border: #f3c4bd;
    --flash: #fff6cc;
    --snippet: #374151;
    --mark-bg: #fff1a8;
    --mark-text: #1f2328;
    --input-bg: #ffffff;
    --skeleton: #eceff3;
    --skeleton-hi: #f7f9fb;
    --overlay: rgba(15, 17, 21, .45);
    --shadow: 0 8px 28px rgba(15, 23, 42, .14);
    --toast-bg: #1f2328;
    --toast-text: #ffffff;
    /* 集合徽标配色。已知集合各占一个色相，其它集合按名字散列到 tone-*；
       深色模式在下面重新定义同一批变量，规则本身不用改。 */
    --coll-tech: #1d4ed8;
    --coll-tech-bg: #e6efff;
    --coll-papers: #7c3aed;
    --coll-papers-bg: #f0e9ff;
    --coll-profile: #b45309;
    --coll-profile-bg: #fff2e0;
    --coll-other: #475569;
    --coll-other-bg: #eef1f5;
    --coll-tone-1: #0f766e; --coll-tone-1-bg: #e0f5f2;
    --coll-tone-2: #a21caf; --coll-tone-2-bg: #fbe8fd;
    --coll-tone-3: #b91c1c; --coll-tone-3-bg: #fdeaea;
    --coll-tone-4: #4d7c0f; --coll-tone-4-bg: #eef7dc;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #161a20;
    --border: #2a303a;
    --border-strong: #3a4352;
    --text: #e6e9ee;
    --muted: #9aa4b2;
    --accent: #7ba7ff;
    --accent-weak: #1b2740;
    --ok: #4ade80;
    --bad: #ff9b93;
    --bad-bg: #2a1517;
    --bad-border: #5a2a2a;
    --flash: #3a3413;
    --snippet: #c7cdd6;
    --mark-bg: #4d431a;
    --mark-text: #ffe58a;
    --input-bg: #11151b;
    --skeleton: #202631;
    --skeleton-hi: #28303c;
    --overlay: rgba(0, 0, 0, .6);
    --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    --toast-bg: #e6e9ee;
    --toast-text: #161a20;
    --coll-tech: #93b4ff;
    --coll-tech-bg: #1b2740;
    --coll-papers: #c9a7ff;
    --coll-papers-bg: #2a2036;
    --coll-profile: #f0b46b;
    --coll-profile-bg: #3a2a17;
    --coll-other: #b6c2d2;
    --coll-other-bg: #222833;
    --coll-tone-1: #7fe0d3; --coll-tone-1-bg: #122e2b;
    --coll-tone-2: #e9b0ee; --coll-tone-2-bg: #33203a;
    --coll-tone-3: #ff9b93; --coll-tone-3-bg: #35191a;
    --coll-tone-4: #bcd98a; --coll-tone-4-bg: #232d15;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI",
                 "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.65;
  }
  body.overlay-open { overflow: hidden; }
  a { color: var(--accent); }
  kbd {
    display: inline-block; min-width: 18px; padding: 0 4px;
    border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px;
    background: var(--panel); color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 11px; line-height: 16px; text-align: center;
  }
  .hidden { display: none !important; }
  .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 顶部 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar .wrap {
    display: flex; align-items: center; gap: 14px;
    padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap;
  }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .brand small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .searchbar { display: flex; align-items: center; gap: 8px; flex: 1 1 460px; flex-wrap: wrap; }
  .searchbox { position: relative; flex: 1 1 220px; min-width: 160px; display: flex; }
  #query-input {
    width: 100%; min-width: 160px;
    height: 36px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--input-bg); color: var(--text);
    font: inherit;
  }
  #query-input:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
  #query-input::placeholder { color: var(--muted); opacity: .85; }

  .modeswitch { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .mode {
    height: 34px; padding: 0 12px;
    border: 0; background: var(--panel); color: var(--muted);
    font: inherit; cursor: pointer;
  }
  .mode + .mode { border-left: 1px solid var(--border); }
  .mode.active { background: var(--accent-weak); color: var(--accent); font-weight: 600; }

  button.primary {
    height: 36px; padding: 0 18px;
    border: 0; border-radius: 8px;
    background: var(--accent); color: #fff;
    font: inherit; font-weight: 500; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: default; }
  :root[data-theme="dark"] button.primary { color: #0b1220; }

  .theme-toggle {
    height: 34px; padding: 0 12px; white-space: nowrap;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- 搜索历史面板 ---------- */
  .history {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 40;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .history-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .history-list { max-height: 300px; overflow-y: auto; }
  .history-item { display: flex; align-items: center; }
  .history-item + .history-item { border-top: 1px solid var(--border); }
  .history-item:hover { background: var(--accent-weak); }
  .history-pick {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 12px; border: 0; background: none;
    color: var(--text); font: inherit; text-align: left; cursor: pointer;
  }
  .history-q {
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .history-meta { flex: none; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .history-del {
    flex: none; width: 28px; height: 28px; margin-right: 6px;
    border: 0; border-radius: 6px; background: none;
    color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer;
  }
  .history-del:hover { background: var(--bad-bg); color: var(--bad); }
  .history-foot { padding: 6px 12px; border-top: 1px solid var(--border); text-align: center; }
  .history-foot button {
    border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 12px; cursor: pointer; padding: 2px 6px;
  }
  .history-foot button:hover { color: var(--bad); }

  /* ---------- 主体 ---------- */
  main { flex: 1 1 auto; padding: 24px 0 40px; }

  .empty {
    padding: 48px 20px; text-align: center; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 10px; background: var(--panel);
  }
  .empty-title { margin: 0; font-size: 15px; color: var(--text); }
  .empty-tips { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; }
  .empty-tips li + li { margin-top: 4px; }

  .loading { padding: 4px 0 12px; }
  .loading-text { margin: 0 0 12px; text-align: center; color: var(--muted); font-size: 13px; }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 8px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .skeleton {
    height: 104px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid var(--border);
    background: linear-gradient(90deg,
      var(--skeleton) 25%, var(--skeleton-hi) 37%, var(--skeleton) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  .error {
    padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--bad-border); background: var(--bad-bg); color: var(--bad);
  }
  .error-text { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }

  /* ---------- 仓库筛选 ---------- */
  .filters {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 0 0 14px;
  }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 11px;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--panel); color: var(--muted);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active {
    background: var(--accent-weak); border-color: var(--accent);
    color: var(--accent); font-weight: 600;
  }
  .filter-count { opacity: .8; font-variant-numeric: tabular-nums; }
  .filter-summary {
    margin-left: auto; color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ---------- 集合选择（请求侧过滤） ---------- */
  .collection-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 0 0 12px;
  }
  .collection-bar-label { font-size: 12px; color: var(--muted); }
  .collection-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .collection-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 28px; padding: 0 11px;
    border: 1px solid var(--border); border-radius: 14px;
    background: var(--panel); color: var(--muted);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .collection-chip:hover { border-color: var(--coll-color); color: var(--coll-color); }
  .collection-chip.active {
    border-color: var(--coll-color);
    background: var(--coll-bg);
    color: var(--coll-color);
    font-weight: 600;
  }
  .collection-hint { font-size: 12px; color: var(--muted); }

  /* ---------- 集合徽标：每个结果卡片一个，颜色由集合决定 ---------- */
  .collection-badge, .collection-chip {
    --coll-color: var(--coll-other);
    --coll-bg: var(--coll-other-bg);
  }
  .coll-tech { --coll-color: var(--coll-tech); --coll-bg: var(--coll-tech-bg); }
  .coll-papers { --coll-color: var(--coll-papers); --coll-bg: var(--coll-papers-bg); }
  .coll-profile { --coll-color: var(--coll-profile); --coll-bg: var(--coll-profile-bg); }
  .tone-0 { --coll-color: var(--coll-tone-1); --coll-bg: var(--coll-tone-1-bg); }
  .tone-1 { --coll-color: var(--coll-tone-2); --coll-bg: var(--coll-tone-2-bg); }
  .tone-2 { --coll-color: var(--coll-tone-3); --coll-bg: var(--coll-tone-3-bg); }
  .tone-3 { --coll-color: var(--coll-tone-4); --coll-bg: var(--coll-tone-4-bg); }
  .collection-badge {
    display: inline-flex; align-items: center;
    height: 20px; padding: 0 8px; flex: none;
    border: 1px solid var(--coll-color); border-radius: 10px;
    background: var(--coll-bg); color: var(--coll-color);
    font-size: 11px; font-weight: 600; letter-spacing: .2px;
    white-space: nowrap;
  }
  .crumb-row {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    margin: 8px 0 6px;
  }
  .crumb-row .crumb { margin: 0; }

  /* ---------- 结果卡片 ---------- */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-weak);
  }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rank {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 30px; height: 22px; padding: 0 7px;
    border-radius: 11px; background: var(--accent-weak); color: var(--accent);
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .score { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .location {
    margin-left: auto; color: var(--muted); font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    word-break: break-all;
  }
  .crumb { margin: 8px 0 6px; font-size: 15px; font-weight: 600; line-height: 1.45; }
  .snippet {
    margin: 0; color: var(--snippet); white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
    overflow: hidden;
  }
  .snippet.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
  mark.hl {
    background: var(--mark-bg); color: var(--mark-text);
    padding: 0 1px; border-radius: 2px;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .ghost {
    height: 30px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost:disabled { opacity: .55; cursor: default; }
  .ghost.small { height: 26px; font-size: 12px; padding: 0 10px; }
  .ghost.copied { border-color: var(--ok); color: var(--ok); }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .meta.bad { color: var(--bad); }

  /* ---------- 问答 ---------- */
  .answer-card.refused { border-color: var(--bad-border); background: var(--bad-bg); }
  .answer-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .answer-title { font-size: 15px; font-weight: 600; }
  .answer-card.refused .answer-title { color: var(--bad); }
  .answer-meta { margin-left: auto; font-size: 12px; color: var(--muted); }
  .refuse-reason {
    margin: 0 0 8px; padding: 8px 12px;
    border-left: 3px solid var(--bad); border-radius: 4px;
    background: var(--panel); color: var(--bad); font-weight: 600;
  }
  .answer-body { white-space: pre-wrap; word-break: break-word; }
  .refuse-hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .ref-badge {
    border: 1px solid var(--accent-weak); border-radius: 4px; background: var(--accent-weak);
    color: var(--accent); font: inherit; font-size: 11px; line-height: 1.4;
    padding: 0 4px; margin: 0 1px; cursor: pointer; vertical-align: text-top;
  }
  .ref-badge:hover { border-color: var(--accent); }
  .warning { margin-top: 10px; font-size: 12px; color: var(--bad); }

  .citations { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 14px; }
  .citations-title { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .citation-list { list-style: none; margin: 0; padding: 0; }
  .citation {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px; background: var(--panel);
    transition: background-color .25s ease;
  }
  .citation.flash { background: var(--flash); }
  .citation-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ref-label { color: var(--accent); font-weight: 600; font-size: 12px; }
  .citation-loc {
    font-size: 12px; color: var(--muted); word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  .citation-crumb { margin-top: 4px; font-size: 13px; font-weight: 600; }
  .citation-text {
    margin: 6px 0 0; font-size: 13px; color: var(--snippet);
    white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- 底部状态条 ---------- */
  #status-bar {
    position: sticky; bottom: 0;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 20px;
    background: var(--panel); border-top: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
  }
  .status-chips { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: 1 1 auto; }
  .chip { white-space: nowrap; }
  .chip.ok { color: var(--ok); }
  .chip.bad { color: var(--bad); }

  /* ---------- 统计浮层 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; background: var(--overlay);
  }
  .overlay-card {
    width: min(560px, 100%); max-height: 82vh; overflow: auto;
    padding: 18px 20px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .overlay-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .overlay-head h2 { margin: 0; font-size: 15px; flex: 1 1 auto; }
  .stats-subtitle { margin: 16px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .stats-grid {
    display: grid; grid-template-columns: auto 1fr;
    gap: 6px 14px; margin: 0; font-size: 13px;
  }
  .stats-grid dt { color: var(--muted); white-space: nowrap; }
  .stats-grid dd { margin: 0; word-break: break-all; }
  .stats-grid code {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    font-size: 12px;
  }
  .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .stats-table th, .stats-table td {
    padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left;
  }
  .stats-table th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .stats-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .stats-loading { margin: 0; color: var(--muted); }

  /* ---------- 今日复习 ---------- */
  .overlay-card.wide { width: min(760px, 100%); }
  .review-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .review-body { display: flex; flex-direction: column; gap: 12px; }
  .review-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .review-tag {
    display: inline-flex; align-items: center;
    height: 24px; padding: 0 9px;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--accent-weak); color: var(--accent); font-size: 12px;
  }
  .review-tag.plain { background: none; color: var(--muted); }
  .review-question { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.5; }
  .review-hint { margin: 0; font-size: 12px; color: var(--muted); }
  textarea.review-answer {
    width: 100%; min-height: 96px; padding: 10px 12px; resize: vertical;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--input-bg); color: var(--text); font: inherit;
  }
  textarea.review-answer:focus {
    outline: 2px solid var(--accent-weak); border-color: var(--accent);
  }
  .review-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .review-section { border-top: 1px solid var(--border); padding-top: 12px; }
  .review-section-title {
    margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .review-your-answer {
    margin: 0; padding: 10px 12px;
    border-left: 3px solid var(--border-strong); border-radius: 4px;
    background: var(--bg); white-space: pre-wrap; word-break: break-word;
  }
  .review-chunk {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; background: var(--panel);
  }
  .review-chunk + .review-chunk { margin-top: 8px; }
  .review-chunk-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .review-chunk-loc {
    font-size: 12px; color: var(--muted); word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }
  .review-chunk-crumb { margin: 4px 0 0; font-size: 13px; font-weight: 600; }
  .review-chunk-text {

<div id="toast" class="hidden"></div>

<!-- 结果卡片上的集合徽标模板：JS 克隆它，颜色由 class（coll-tech / tone-N）决定 -->
<template id="collection-badge-tpl"><span class="collection-badge"></span></template>

<script>
(function () {
  'use strict';

  /* ================================================================
   *  常量与全局状态
   * ================================================================ */

  var HISTORY_KEY = 'kb.searchHistory';
  var THEME_KEY = 'kb.theme';
  var COLLECTION_KEY = 'kb.collections';
  var RERANK_KEY = 'kb.rerank';            // '1' = 模型精排开启
  var HISTORY_LIMIT = 20;
  var THEMES = ['auto', 'light', 'dark'];        // 循环顺序：auto -> light -> dark
  var THEME_LABEL = { auto: '自动', light: '浅色', dark: '深色' };
  var RESULT_TOP_K = 10;
  var UNKNOWN_REPO = '(未知仓库)';
  var DEFAULT_EMPTY = '输入关键词后回车开始检索';
  var TIPS_SEARCH = [
    '换个关键词，或缩短查询（长句会被整串匹配）',
    '试试问答模式，让模型基于检索结果作答'
  ];
  var TIPS_ASK = [
    '问答会先检索，再让模型基于原文作答并标注引用',
    '资料不足时系统会明确拒答，不会自行编造'
  ];

  var state = {
    mode: 'search',          // search | ask
    busy: false,
    theme: 'auto',
    health: null,
    healthError: null,
    lastElapsed: null,       // 前端总耗时
    lastServerMs: null,      // 服务端检索耗时
    lastQuery: '',
    results: [],             // 本次检索的完整结果
    visible: [],             // 过滤后实际渲染的结果
    repos: [],               // [{name, count}]
    activeRepos: {},         // 选中的仓库名集合；空对象 = 不过滤
    collections: [],         // /api/collections 的集合列表 [{name, chunks, has_index}]
    defaultCollections: [],  // 服务端给的默认集合
    activeCollections: [],   // 选中的集合名；影响请求，不参与结果过滤
    collectionsLoaded: false,
    terms: [],               // 高亮词
    selected: -1,            // 键盘选中的结果下标
    historyOpen: false,
    stats: null,             // /api/stats 响应缓存
    statsLoading: false,
    review: null,            // /api/review/today 响应缓存
    reviewDraft: '',         // 本次会话里的答题草稿，刷新即丢
    rerank: false            // 模型精排：把前 15 条交给模型挑相关的
  };

  /* ================================================================
   *  基础工具
   * ================================================================ */

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, content) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (content !== undefined && content !== null) node.textContent = String(content);
    return node;
  }

  function show(id) { var node = $(id); if (node) node.classList.remove('hidden'); }
  function hide(id) { var node = $(id); if (node) node.classList.add('hidden'); }

  function on(id, event, handler) {
    var node = $(id);
    if (node) node.addEventListener(event, handler);
  }

  function fmtInt(value) {
    if (typeof value !== 'number' || !isFinite(value)) return String(value == null ? '-' : value);
    return value.toLocaleString('en-US');
  }

  function fmtScore(value) {
    return typeof value === 'number' && isFinite(value)
      ? 'score ' + value.toFixed(4)
      : 'score ' + String(value);
  }

  function fmtMb(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '-';
    return value.toFixed(1) + ' MB';
  }

  /* ---- 存储：localStorage 被禁用时降级成「本次会话内可用」 ---- */

  var memoryStore = {};

  function storageGet(key) {
    try {
      var value = window.localStorage.getItem(key);
      if (value !== null) return value;
    } catch (err) { /* 隐私模式 / file:// 下可能抛错 */ }
    return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
  }

  function storageSet(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return true;
    } catch (err) {
      memoryStore[key] = value;
      return false;
    }
  }

  /* ================================================================
   *  HTML 转义与关键词高亮
   *
   *  高亮必须「先转义、再拼 <mark>」：把原文按匹配区间切成若干段，每一段
   *  单独 escapeHtml，只有包住命中词的标签是代码里写死的。顺序反过来
   *  （先插标签再整体转义）会把 <mark> 转成 &lt;mark&gt;，先插标签后不转义
   *  则是直接 XSS。脚本里所有 innerHTML 赋值都只允许走 highlightHtml()。
   * ================================================================ */

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function regexEscape(value) {
    return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  /** 查询词 -> 高亮词表。整串优先（中文词组），再按空白切；去重、长词在前。 */
  function splitTerms(query) {
    var raw = String(query == null ? '' : query).trim();
    if (!raw) return [];
    var list = [raw];
    raw.split(/\s+/).forEach(function (part) {
      if (part) list.push(part);
    });
    list.sort(function (a, b) { return b.length - a.length; });
    var seen = {};
    return list.filter(function (term) {
      if (seen[term]) return false;
      seen[term] = true;
      return true;
    });
  }

  /** 返回可以安全写进 innerHTML 的字符串：文本段已转义，只有 <mark> 是标签。 */
  function highlightHtml(source, terms) {
    var raw = String(source == null ? '' : source);
    if (!raw) return '';
    if (!terms || !terms.length) return escapeHtml(raw);

    var pattern;
    try {
      pattern = new RegExp('(' + terms.map(regexEscape).join('|') + ')', 'gi');
    } catch (err) {
      return escapeHtml(raw);
    }

    var html = '';
    var last = 0;
    var match;
    while ((match = pattern.exec(raw)) !== null) {
      if (!match[0]) { pattern.lastIndex += 1; continue; }
      html += escapeHtml(raw.slice(last, match.index));
      html += '<mark class="hl">' + escapeHtml(match[0]) + '</mark>';
      last = match.index + match[0].length;
    }
    html += escapeHtml(raw.slice(last));
    return html;
  }

  /* ================================================================
   *  fetch 封装：非 2xx / 网络错误 / 非 JSON 都变成带人话的 Error
   * ================================================================ */

  async function api(path, options) {
    var response;
    try {
      response = await fetch(path, options);
    } catch (err) {
      throw new Error('连不上后端：' + (err && err.message ? err.message : err));
    }
    var data = null;
    try { data = await response.json(); } catch (err) { data = null; }
    if (!response.ok) {
      var detail = data && (data.detail || data.error);
      if (Array.isArray(detail)) {
        detail = detail.map(function (item) {
          return item && item.msg ? item.msg : JSON.stringify(item);
        }).join('; ');
      }
      throw new Error(typeof detail === 'string' && detail
        ? detail
        : ('HTTP ' + response.status));
    }
    if (data === null) throw new Error('响应不是合法 JSON');
    return data;
  }

  /* ================================================================
   *  主题：auto 跟随系统，light / dark 手动；只改 data-theme
   * ================================================================ */

  function loadTheme() {
    var saved = storageGet(THEME_KEY);
    return THEMES.indexOf(saved) >= 0 ? saved : 'auto';
  }

  function detectDark() {
    try {
      return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    } catch (err) {
      return false;
    }
  }

  function applyTheme() {
    var resolved = state.theme === 'auto'
      ? (detectDark() ? 'dark' : 'light')
      : state.theme;
    document.documentElement.setAttribute('data-theme', resolved);
    var button = $('theme-toggle');
    if (button) {
      button.textContent = (resolved === 'dark' ? '🌙' : '☀') + ' ' + THEME_LABEL[state.theme];
      button.title = '主题：' + THEME_LABEL[state.theme] + '（点击切换 自动 → 浅色 → 深色）';
      button.setAttribute('aria-label', button.title);
    }
  }

  function cycleTheme() {
    var index = THEMES.indexOf(state.theme);
    state.theme = THEMES[(index + 1) % THEMES.length];
    storageSet(THEME_KEY, state.theme);
    applyTheme();
  }

  function watchSystemTheme() {
    if (!window.matchMedia) return;
    var query;
    try { query = window.matchMedia('(prefers-color-scheme: dark)'); }
    catch (err) { return; }
    var handler = function () { if (state.theme === 'auto') applyTheme(); };
    if (query.addEventListener) query.addEventListener('change', handler);
    else if (query.addListener) query.addListener(handler);
  }

  /* ================================================================
   *  搜索历史：localStorage['kb.searchHistory'] = [{q, mode, ts}, ...]
   *  - 最新的在最前，最多 20 条
   *  - 同 q + mode 只保留一条：新记录插到最前并删掉旧的那条
   * ================================================================ */

  function validHistoryItem(item) {
    return !!item && typeof item.q === 'string' && !!item.q.trim();
  }

  function loadHistory() {
    var raw = storageGet(HISTORY_KEY);
    if (!raw) return [];
    var parsed;
    try { parsed = JSON.parse(raw); } catch (err) { return []; }
    if (!Array.isArray(parsed)) return [];

    var seen = {};
    var list = [];
    parsed.forEach(function (item) {
      if (!validHistoryItem(item)) return;
      var mode = item.mode === 'ask' ? 'ask' : 'search';
      var key = item.q + '\u0000' + mode;
      if (seen[key]) return;
      seen[key] = true;
      list.push({
        q: item.q,
        mode: mode,
        ts: typeof item.ts === 'number' && isFinite(item.ts) ? item.ts : Date.now()
      });
    });
    return list.slice(0, HISTORY_LIMIT);
  }

  function saveHistory(list) {
    storageSet(HISTORY_KEY, JSON.stringify(list.slice(0, HISTORY_LIMIT)));
  }

  function addHistory(query, mode) {
    var rest = loadHistory().filter(function (item) {
      return !(item.q === query && item.mode === mode);
    });
    rest.unshift({ q: query, mode: mode, ts: Date.now() });
    saveHistory(rest);
  }

  function removeHistory(query, mode) {
    saveHistory(loadHistory().filter(function (item) {
      return !(item.q === query && item.mode === mode);
    }));
  }

  function clearHistory() {
    saveHistory([]);
    closeHistory();
    toast('搜索历史已清空', false);
  }

  function pad2(value) { return (value < 10 ? '0' : '') + value; }

  /** 相对时间：1 分钟内「刚刚」，1 小时内 N 分钟前，24 小时内 N 小时前，更早 MM-DD。 */
  function relativeTime(ts) {
    var diff = Date.now() - ts;
    if (!isFinite(diff) || diff < 0) diff = 0;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / (60 * 1000)) + '分钟前';
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / (60 * 60 * 1000)) + '小时前';
    var date = new Date(ts);
    return pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
  }

  function renderHistory() {
    var panel = $('history-panel');
    var list = $('history-list');
    if (!panel || !list) return;
    var items = loadHistory();
    if (!items.length) {
      closeHistory();
      return;
    }

    list.replaceChildren();
    items.forEach(function (item) {
      var row = el('div', 'history-item');

      var pick = el('button', 'history-pick');
      pick.type = 'button';
      pick.title = (item.mode === 'ask' ? '问答' : '检索') + ' · ' + item.q;
      pick.appendChild(el('span', 'history-q', item.q));
      pick.appendChild(el('span', 'history-meta',
        (item.mode === 'ask' ? '问答' : '检索') + ' · ' + relativeTime(item.ts)));
      pick.addEventListener('click', function () { pickHistory(item); });

      var del = el('button', 'history-del', '×');
      del.type = 'button';
      del.title = '删除这条历史';
      del.setAttribute('aria-label', '删除历史：' + item.q);
      del.addEventListener('click', function (event) {
        if (event && event.stopPropagation) event.stopPropagation();
        removeHistory(item.q, item.mode);
        renderHistory();
      });

      row.appendChild(pick);
      row.appendChild(del);
      list.appendChild(row);
    });

    panel.classList.remove('hidden');
    state.historyOpen = true;
    var input = $('query-input');
    if (input) input.setAttribute('aria-expanded', 'true');
  }

  function openHistory() {
    if (state.busy) return;
    if (!loadHistory().length) return;   // 历史为空时不弹面板
    renderHistory();
  }

  function closeHistory() {
    hide('history-panel');
    state.historyOpen = false;
    var input = $('query-input');
    if (input) input.setAttribute('aria-expanded', 'false');
  }

  function pickHistory(item) {
    var input = $('query-input');
    if (!input) return;
    input.value = item.q;
    applyMode(item.mode);
    closeHistory();
    input.focus();
    run();
  }

  /* ================================================================
   *  URL 状态：搜索时把 q / mode 写进 query string，刷新/分享可复现
   * ================================================================ */

  function readUrlState() {
    var result = { q: '', mode: 'search', collections: [] };
    try {
      var params = new URLSearchParams(window.location.search);
      result.q = (params.get('q') || '').trim();
      result.mode = params.get('mode') === 'ask' ? 'ask' : 'search';
      result.collections = (params.get('collections') || '')
        .split(',')
        .map(function (name) { return name.trim(); })
        .filter(function (name) { return !!name; });
    } catch (err) { /* 老浏览器不支持 URLSearchParams 时按空状态处理 */ }
    return result;
  }

  function syncUrl(query, mode) {
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('q', query);
      url.searchParams.set('mode', mode);
      // 集合也进 URL，刷新后能恢复同一组索引
      var names = state.activeCollections.filter(function (name) { return !!name; });
      if (names.length) url.searchParams.set('collections', names.join(','));
      else url.searchParams.delete('collections');
      // replaceState：连续搜索不会塞满浏览器的后退栈
      window.history.replaceState(null, '', url.pathname + url.search + url.hash);
    } catch (err) { /* file:// 等场景下同步失败不影响搜索 */ }
  }

  /* ================================================================
   *  加载 / 空结果 / 错误 三种状态的切换
   * ================================================================ */

  function hideMessages() {
    hide('empty-state');
    hide('loading');
    hide('error-box');
  }

  function showEmpty(title, hints) {
    var box = $('empty-state');
    if (!box) return;
    box.replaceChildren();
    box.appendChild(el('p', 'empty-title', title || DEFAULT_EMPTY));
    var list = el('ul', 'empty-tips');
    (hints || []).forEach(function (hint) { list.appendChild(el('li', null, hint)); });
    if (list.childNodes.length) box.appendChild(list);
    hideMessages();
    box.classList.remove('hidden');
  }

  function showLoading() {
    hide('empty-state');
    hide('error-box');
    show('loading');
  }

  function showError(message) {
    hide('loading');
    hide('empty-state');
    hide('results');
    hide('filters');
    var text = $('error-text');
    if (text) text.textContent = '请求失败：' + (message || '未知错误');
    show('error-box');
  }

  function setBusy(busy) {
    state.busy = busy;
    var button = $('search-btn');
    if (button) {
      button.disabled = busy;
      button.textContent = busy ? '搜索中…' : '搜索';
    }
    var input = $('query-input');
    if (input) input.setAttribute('aria-busy', busy ? 'true' : 'false');
  }

  function resetOutput() {
    var results = $('results');
    if (results) {
      results.replaceChildren();
      results.classList.add('hidden');
    }
    var answer = $('answer-panel');
    if (answer) {
      answer.replaceChildren();
      answer.classList.add('hidden');
    }
    var filters = $('filters');
    if (filters) filters.classList.add('hidden');
    var chips = $('filter-chips');
    if (chips) chips.replaceChildren();
    var summary = $('filter-summary');
    if (summary) summary.textContent = '';
    var note = $('rerank-note');
    if (note) {
      note.replaceChildren();
      note.classList.add('hidden');
    }

    state.results = [];
    state.visible = [];
    state.repos = [];
    state.activeRepos = {};
    state.terms = [];
    state.selected = -1;
    hideMessages();
  }

  /* ================================================================
   *  提示条
   * ================================================================ */

  var toastTimer = null;

  function toast(message, isError) {
    var box = $('toast');
    if (!box) return;
    box.textContent = message;
    box.classList.remove('hidden');
    box.classList.toggle('bad', !!isError);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.classList.add('hidden'); }, 4000);
  }

  /* ================================================================
   *  集合（collection）
   *
   *  两层过滤，互不干扰：
   *    · 集合 chip —— 决定**请求**查哪些索引（拼进 ?collections=...）；
   *    · 仓库 chip —— 只对**本次已返回的结果**做前端筛选，不再发请求。
   *  所以切集合要重发请求并清空仓库筛选（结果集变了，旧筛选没有意义），
   *  而切仓库只在本地重排。
   *
   *  选择状态存 localStorage['kb.collections']（JSON 数组）。存的集合名可能
   *  来自上一次的配置（集合被删了 / 改名了），加载时按 /api/collections
   *  过滤一遍，对不上就忽略。
   * ================================================================ */

  function collectionDisplay(name) { return name || '默认'; }

  function knownCollection(name) {
    return state.collections.some(function (item) { return item.name === name; });
  }

  /** 集合 -> 颜色 class。已知集合各有专属色，其它按名字散列到 tone-0..3。 */
  function collectionTone(name) {
    var key = String(name || '');
    if (key === 'tech' || key === 'papers' || key === 'profile') return 'coll-' + key;
    var hash = 0;
    for (var i = 0; i < key.length; i++) {
      hash = (hash * 31 + key.charCodeAt(i)) % 9973;
    }
    return 'tone-' + (hash % 4);
  }

  function loadStoredCollections() {
    var raw = storageGet(COLLECTION_KEY);
    if (!raw) return [];
    var parsed;
    try { parsed = JSON.parse(raw); } catch (err) { return []; }
    if (!Array.isArray(parsed)) return [];
    var seen = {};
    return parsed.filter(function (name) {
      if (typeof name !== 'string' || !name) return false;
      if (seen[name] || !knownCollection(name)) return false;
      seen[name] = true;
      return true;
    });
  }

  function saveCollections() {
    storageSet(COLLECTION_KEY, JSON.stringify(state.activeCollections));
  }

  /** 初始选中：本地存的有效值 > 服务端默认 > 全部。 */
  function defaultActiveCollections() {
    var stored = loadStoredCollections();
    if (stored.length) return stored;
    var defaults = (state.defaultCollections || []).filter(knownCollection);
    if (defaults.length) return defaults;
    return state.collections.map(function (item) { return item.name; });
  }

  /** 拼进请求的 collections 参数：一个都没选时退回 all（后端展开成全部）。 */
  function collectionQuery() {
    var names = state.activeCollections.filter(function (name) {
      return typeof name === 'string' && name !== '';
    });
    return names.length ? names.join(',') : 'all';
  }

  function renderCollectionChips() {
    var wrap = $('collection-filters');
    var chips = $('collection-chips');
    if (!wrap || !chips) return;
    chips.replaceChildren();

    var hint = $('collection-hint');
    if (hint) {
      // 检索和问答都按选中的集合走，这里只提示当前生效的集合数
      hint.textContent = state.activeCollections.length
        ? '' : '未选择集合，将使用默认集合';
    }
    if (!state.collections.length) {
      wrap.classList.add('hidden');
      return;
    }

    state.collections.forEach(function (item) {
      var active = state.activeCollections.indexOf(item.name) >= 0;
      var chip = el('button', 'collection-chip ' + collectionTone(item.name));
      chip.type = 'button';
      chip.setAttribute('data-collection', item.name);
      chip.classList.toggle('active', active);
      chip.setAttribute('aria-pressed', active ? 'true' : 'false');
      chip.title = collectionDisplay(item.name) + ' · ' + fmtInt(item.chunks) + ' 块'
        + (item.has_index ? '' : '（还没有索引）')
        + (active ? '（点击取消）' : '（点击只看这个集合）');
      chip.appendChild(el('span', null, collectionDisplay(item.name)));
      chip.appendChild(el('span', 'filter-count', fmtInt(item.chunks)));
      chip.addEventListener('click', function () { toggleCollection(item.name); });
      chips.appendChild(chip);
    });
    wrap.classList.remove('hidden');
  }

  function toggleCollection(name) {
    var active = state.activeCollections.slice();
    var at = active.indexOf(name);
    if (at >= 0) {
      if (active.length === 1) {
        // 一个都不选等于没有可查的索引，后端会 400；这里直接挡住
        toast('至少要保留一个集合', true);
        return;
      }
      active.splice(at, 1);
    } else {
      active.push(name);
    }
    state.activeCollections = active;
    saveCollections();
    // 结果集会变，旧的仓库筛选立刻失效
    state.activeRepos = {};
    renderCollectionChips();
    renderFilters();

    if (state.busy) return;
    if (state.mode === 'search' && state.lastQuery) {
      run();                       // 有上一次检索就按新集合重查
    } else if (state.results.length) {
      renderResults();
    }
  }

  /** 用 URL 里的集合覆盖选择；没有有效名字时保持原样。 */
  function applyCollections(names) {
    var wanted = (names || []).filter(knownCollection);
    if (!wanted.length) return false;
    state.activeCollections = wanted;
    saveCollections();
    renderCollectionChips();
    return true;
  }

  async function loadCollections() {
    try {
      var data = await api('/api/collections');
      state.collections = (data.collections || []).filter(function (item) {
        return !!item && typeof item.name === 'string';
      }).map(function (item) {
        return {
          name: item.name,
          chunks: Number(item.chunks) || 0,
          has_index: item.has_index !== false
        };
      });
      state.defaultCollections = Array.isArray(data.default) ? data.default : [];
    } catch (err) {
      state.collections = [];
      state.defaultCollections = [];
      toast('集合列表加载失败：' + (err && err.message ? err.message : err), true);
    }
    state.collectionsLoaded = true;
    state.activeCollections = defaultActiveCollections();
    renderCollectionChips();
    renderStatus();
  }

  /* ================================================================
   *  仓库聚合与筛选
   * ================================================================ */

  function repoNameOf(item) { return item.repo || UNKNOWN_REPO; }

  function aggregateRepos(items) {
    var counts = {};
    var order = [];
    items.forEach(function (item) {
      var name = repoNameOf(item);
      if (!Object.prototype.hasOwnProperty.call(counts, name)) {
        counts[name] = 0;
        order.push(name);
      }
      counts[name] += 1;
    });
    return order.map(function (name) {
      return { name: name, count: counts[name] };
    }).sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0);
    });
  }

  function isRepoActive(name) {
    return Object.prototype.hasOwnProperty.call(state.activeRepos, name);
  }

  function activeRepoCount() { return Object.keys(state.activeRepos).length; }

  function filteredItems() {
    if (!activeRepoCount()) return state.results.slice();
    return state.results.filter(function (item) { return isRepoActive(repoNameOf(item)); });
  }

  function updateFilterSummary() {
    var summary = $('filter-summary');
    if (!summary) return;
    var total = state.results.length;
    var shown = filteredItems().length;
    summary.textContent = activeRepoCount()
      ? '筛选后 ' + shown + '/' + total + ' 条'
      : '共 ' + total + ' 条';
  }

  function renderFilters() {
    var wrap = $('filters');
    var chips = $('filter-chips');
    if (!wrap || !chips) return;
    chips.replaceChildren();

    if (!state.results.length) {
      wrap.classList.add('hidden');
      updateFilterSummary();
      return;
    }

    state.repos.forEach(function (repo) {
      var open = isRepoActive(repo.name);
      var button = el('button', 'filter-chip', repo.name);
      button.type = 'button';
      button.classList.toggle('active', open);
      button.setAttribute('aria-pressed', open ? 'true' : 'false');
      button.title = open ? '取消筛选 ' + repo.name : '只看 ' + repo.name;
      button.appendChild(el('span', 'filter-count', String(repo.count)));
      button.addEventListener('click', function () { toggleRepo(repo.name); });
      chips.appendChild(button);
    });

    wrap.classList.remove('hidden');
    updateFilterSummary();
  }

  function toggleRepo(name) {
    if (isRepoActive(name)) delete state.activeRepos[name];
    else state.activeRepos[name] = true;
    renderFilters();
    renderResults();
  }

  /* ================================================================
   *  结果卡片
   * ================================================================ */

  function locationOf(item) {
    var text = (item.repo ? item.repo + '/' : '') + item.rel_path;
    // PDF 的 locator 是 P3 / P3-4，Markdown 没有 locator 时退回行号
    if (item.locator) return text + ':' + item.locator;
    if (item.line_start) text += ':' + item.line_start + '-' + item.line_end;
    return text;
  }

  function normalizeResult(raw) {
    var text = String(raw.text == null ? '' : raw.text);
    var full = raw.text_full == null ? null : String(raw.text_full);
    return {
      chunk_id: String(raw.chunk_id || ''),
      rank: Number(raw.rank) || 0,
      score: Number(raw.score) || 0,
      collection: String(raw.collection || ''),
      breadcrumb: String(raw.breadcrumb || ''),
      repo: String(raw.repo || ''),
      rel_path: String(raw.rel_path || ''),
      line_start: Number(raw.line_start) || 0,
      line_end: Number(raw.line_end) || 0,
      locator: String(raw.locator || ''),
      text: text,
      text_full: full,
      text_chars: Number(raw.text_chars) || (full || text).length,
      truncated: !!raw.truncated || !!full,
      abs_path: raw.abs_path ? String(raw.abs_path) : null
    };
  }

  /* 线上部署（HF / 魔搭）不带语料原文，容器里也没有编辑器。这两种情况下
     「在 VS Code 打开」和「源文件未找到」都是噪音，按 /api/health 的报告关掉，
     别把正常的降级渲染成错误。health 还没回来时按「本地」处理，宁可多显示一个按钮。 */
  function editorAvailable() {
    if (!state.health) return true;
    return !!state.health.editor;
  }

  function rawDirAvailable() {
    if (!state.health) return true;
    return state.health.raw_dir_exists !== false;
  }

  /** 结果卡片左上角的集合徽标：克隆 HTML 里的 <template>，颜色按集合区分。 */
  function collectionBadge(name) {    var tpl = $('collection-badge-tpl');
    var badge = (tpl && tpl.content && tpl.content.firstElementChild)
      ? tpl.content.firstElementChild.cloneNode(true)
      : el('span', 'collection-badge');
    var key = String(name || '');
    badge.textContent = collectionDisplay(key);
    badge.setAttribute('data-collection', key);
    badge.classList.add(collectionTone(key));
    badge.title = '来源集合：' + collectionDisplay(key);
    return badge;
  }

  function renderCard(item, displayRank) {
    var card = el('article', 'card');
    card.setAttribute('data-rank', String(displayRank));

    var head = el('div', 'card-head');
    head.appendChild(el('span', 'rank', '#' + displayRank));
    head.appendChild(el('span', 'score', fmtScore(item.score)));
    head.appendChild(el('span', 'location', locationOf(item)));
    card.appendChild(head);

    // breadcrumb 前的小徽标：这条结果来自哪个集合
    var crumbRow = el('div', 'crumb-row');
    crumbRow.appendChild(collectionBadge(item.collection));
    crumbRow.appendChild(el('h2', 'crumb', item.breadcrumb || '(无标题)'));
    card.appendChild(crumbRow);

    var body = el('div', 'snippet');
    if (item.text) {
      // 唯一允许写 innerHTML 的地方：highlightHtml 已经逐段转义
      body.innerHTML = highlightHtml(item.text, state.terms);
    } else {
      body.textContent = '(空)';
    }
    card.appendChild(body);

    var actions = el('div', 'actions');

    var expanded = false;
    var expandButton = el('button', 'ghost', '展开全文');
    expandButton.type = 'button';
    expandButton.addEventListener('click', function () {
      expanded = !expanded;
      var current = expanded ? (item.text_full || item.text || '') : (item.text || '');
      body.innerHTML = highlightHtml(current, state.terms);
      body.classList.toggle('expanded', expanded);
      expandButton.textContent = expanded ? '收起' : '展开全文';
    });
    actions.appendChild(expandButton);

    var openButton = el('button', 'ghost', '在 VS Code 打开');
    openButton.type = 'button';
    openButton.setAttribute('data-action', 'open');
    openButton.addEventListener('click', function () { openInEditor(item, openButton); });
    if (editorAvailable()) actions.appendChild(openButton);

    var copyButton = el('button', 'ghost', '复制引用');
    copyButton.type = 'button';
    copyButton.setAttribute('data-action', 'copy');
    copyButton.addEventListener('click', function () { copyCitation(item, copyButton); });
    actions.appendChild(copyButton);

    card.appendChild(actions);

    if (item.text_chars) {
      card.appendChild(el('div', 'meta', '全文 ' + fmtInt(item.text_chars) + ' 字符'));
    }
    // 只有「本地应该有语料」时才报警；线上本来就不带原文，提示一句是噪音
    if (!item.abs_path && rawDirAvailable()) {
      card.appendChild(el('div', 'meta bad',
        '源文件未找到：检查启动时的 --raw-dir 是否指向语料仓库根目录'));
    }
    return card;
  }

  function renderResults() {
    var box = $('results');
    if (!box) return;

    var items = filteredItems();
    state.visible = items;
    state.selected = -1;
    box.replaceChildren();
    items.forEach(function (item, index) {
      box.appendChild(renderCard(item, index + 1));   // 过滤后重新编号
    });
    updateFilterSummary();
    hideMessages();

    if (!items.length) {
      box.classList.add('hidden');
      showEmpty('当前筛选下没有结果', ['取消仓库筛选', '换个关键词再试']);
      return;
    }
    box.classList.remove('hidden');
  }

  /* ================================================================
   *  复制引用（Markdown 链接）
   * ================================================================ */

  function citationOf(item) {
    var path = (item.repo ? item.repo + '/' : '') + item.rel_path;
    var label = item.breadcrumb ? item.breadcrumb : path;
    var target = path + (item.line_start ? ':' + item.line_start : '');
    return '[' + label + '](' + target + ')';
  }

  function legacyCopy(text) {
    return new Promise(function (resolve, reject) {
      var area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', 'readonly');
      area.style.position = 'fixed';
      area.style.top = '-1000px';
      area.style.opacity = '0';
      document.body.appendChild(area);
      var ok = false;
      try {
        area.select();
        area.setSelectionRange(0, area.value.length);
        if (typeof document.execCommand === 'function') {
          ok = document.execCommand('copy');
        }
      } catch (err) {
        ok = false;
      }
      document.body.removeChild(area);
      if (ok) resolve();
      else reject(new Error('浏览器拒绝了复制命令'));
    });
  }

  function copyText(text) {
    var value = String(text);
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        return navigator.clipboard.writeText(value).catch(function () {
          return legacyCopy(value);
        });
      }
    } catch (err) { /* 非安全上下文等原因，走回退 */ }
    return legacyCopy(value);
  }

  function copyCitation(item, button) {
    var label = button ? button.textContent : '复制引用';
    copyText(citationOf(item)).then(function () {
      if (button) {
        if (button._copyTimer) clearTimeout(button._copyTimer);
        button.textContent = '已复制';
        button.classList.add('copied');
        button._copyTimer = setTimeout(function () {
          button.textContent = label;
          button.classList.remove('copied');
          button._copyTimer = null;
        }, 1500);
      }
      toast('已复制：' + citationOf(item), false);
    }).catch(function (err) {
      toast('复制失败：' + (err && err.message ? err.message : err), true);
    });
  }

  /* ================================================================
   *  打开源文件
   * ================================================================ */

  async function openInEditor(item, button) {
    var label = button ? button.textContent : '';
    if (button) {
      button.disabled = true;
      button.textContent = '打开中…';
    }
    try {
      var result = await api('/api/open?chunk_id=' + encodeURIComponent(item.chunk_id));
      if (result.ok) toast('已打开：' + result.command, false);
      else toast('打开失败：' + (result.error || result.command || '未知原因'), true);
    } catch (err) {
      toast('打开失败：' + err.message, true);
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = label;
      }
    }
  }

  /* ================================================================
   *  检索
   * ================================================================ */

  async function search(query) {
    // 集合是请求侧参数：切了集合就换了索引，结果集完全不同
    var data = await api('/api/search?q=' + encodeURIComponent(query) +
      '&top_k=' + RESULT_TOP_K + '&mode=hybrid' +
      '&collections=' + encodeURIComponent(collectionQuery()) +
      (state.rerank ? '&rerank=1' : ''));
    state.lastServerMs = typeof data.elapsed_ms === 'number' ? data.elapsed_ms : null;
    state.terms = splitTerms(query);
    state.results = (data.results || []).map(normalizeResult);
    state.repos = aggregateRepos(state.results);
    state.activeRepos = {};
    renderRerankNote(data);

    if (!state.results.length) {
      hide('results');
      hide('filters');
      showEmpty('没有找到与「' + query + '」相关的内容', [
        '换个关键词，或把长句拆成几个词',
        '去掉筛选条件（如果之前选过仓库或集合）',
        '试试问答模式，让模型基于检索结果作答'
      ]);
      return;
    }
    renderFilters();
    renderResults();
  }

  /* ---------- 模型精排 ---------- */

  function loadRerank() {
    return storageGet(RERANK_KEY) === '1';
  }

  function applyRerank() {
    var button = $('rerank-toggle');
    if (!button) return;
    button.classList.toggle('active', state.rerank);
    button.setAttribute('aria-pressed', state.rerank ? 'true' : 'false');
    button.textContent = state.rerank ? '模型精排 开' : '模型精排';
    button.title = state.rerank
      ? '已开启：前 15 条会交给模型挑相关的再排序，慢 1~2 秒'
      : '把前 15 条结果交给模型挑出真正相关的再排序：慢 1~2 秒，能滤掉词面重合的噪音';
  }

  function toggleRerank() {
    state.rerank = !state.rerank;
    storageSet(RERANK_KEY, state.rerank ? '1' : '0');
    applyRerank();
    if (state.lastQuery) run();     // 切了开关立刻用新设置重跑一次
  }

  function renderRerankNote(data) {
    var note = $('rerank-note');
    if (!note) return;
    note.replaceChildren();
    if (!data || !data.reranked) {
      note.classList.add('hidden');
      return;
    }
    var kept = Array.isArray(data.results) ? data.results.length : 0;
    var total = Number(data.candidates) || kept;
    if (!kept) {
      note.appendChild(document.createTextNode(
        '模型精排：' + total + ' 条候选里没有和问题相关的内容，换个问法，或关掉精排看原始结果'));
    } else {
      note.appendChild(document.createTextNode(
        '模型精排：从 ' + total + ' 条候选里保留 ' + kept + ' 条'));
    }
    note.classList.remove('hidden');
  }

  /* ================================================================
   *  问答
   * ================================================================ */

  function refBadge(number) {
    var badge = el('button', 'ref-badge', String(number));
    badge.type = 'button';
    badge.title = '跳转到引用 ' + number;
    badge.addEventListener('click', function () { jumpToCitation(number); });
    return badge;
  }

  function renderAnswerText(container, text, maxRef) {
    var pattern = /\[(\d+)\]/g;
    var last = 0;
    var match;
    while ((match = pattern.exec(text)) !== null) {
      if (match.index > last) {
        container.appendChild(document.createTextNode(text.slice(last, match.index)));
      }
      var number = parseInt(match[1], 10);
      if (number >= 1 && number <= maxRef) container.appendChild(refBadge(number));
      else container.appendChild(document.createTextNode(match[0]));
      last = pattern.lastIndex;
    }
    container.appendChild(document.createTextNode(text.slice(last)));
  }

  function jumpToCitation(number) {
    var target = document.getElementById('citation-' + number);
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.classList.remove('flash');
    void target.offsetWidth;
    target.classList.add('flash');
    setTimeout(function () { target.classList.remove('flash'); }, 1800);
  }

  function renderCitations(list) {
    var wrap = el('section', 'citations');
    wrap.appendChild(el('h3', 'citations-title', '引用（' + list.length + ' 条）'));
    var ordered = el('ol', 'citation-list');
    list.forEach(function (citation) {
      var item = el('li', 'citation');
      item.id = 'citation-' + citation.ref;

      var head = el('div', 'citation-head');
      head.appendChild(el('span', 'ref-label', '[' + citation.ref + ']'));
      var location = (citation.repo ? citation.repo + '/' : '') + citation.rel_path;
      if (citation.line_start) location += ':' + citation.line_start + '-' + citation.line_end;
      head.appendChild(el('span', 'citation-loc', location));
      item.appendChild(head);

      if (citation.breadcrumb) item.appendChild(el('div', 'citation-crumb', citation.breadcrumb));
      if (citation.text) item.appendChild(el('p', 'citation-text', citation.text));

      var button = el('button', 'ghost small', '在 VS Code 打开');
      button.type = 'button';
      button.addEventListener('click', function () {
        openInEditor({ chunk_id: citation.chunk_id }, button);
      });
      if (editorAvailable()) item.appendChild(button);
      ordered.appendChild(item);
    });
    wrap.appendChild(ordered);
    return wrap;
  }

  function renderAnswer(data) {
    var panel = $('answer-panel');
    if (!panel) return;
    panel.replaceChildren();

    var card = el('article', 'card answer-card' + (data.refused ? ' refused' : ''));
    var head = el('div', 'answer-head');
    head.appendChild(el('span', 'answer-title', data.refused ? '拒答' : '答案'));
    var meta = [data.model || '未知模型'];
    if (typeof data.latency_ms === 'number') meta.push(data.latency_ms + ' ms');
    if (typeof data.context_chunks === 'number') meta.push('上下文 ' + data.context_chunks + ' 块');
    head.appendChild(el('span', 'answer-meta', meta.join(' · ')));
    card.appendChild(head);

    var citations = data.citations || [];
    if (data.refused) {
      card.appendChild(el('p', 'refuse-reason', '原因：' + (data.refuse_reason || '资料不足')));
      card.appendChild(el('div', 'answer-body', data.text || ''));
      card.appendChild(el('p', 'refuse-hint', '下方保留了这次检索到的原文，可直接打开或复制引用。'));
    } else {
      var body = el('div', 'answer-body');
      renderAnswerText(body, data.text || '', citations.length);
      card.appendChild(body);
      if (data.invalid_refs && data.invalid_refs.length) {
        card.appendChild(el('div', 'warning',
          '答案引用了不存在的编号：' +
          data.invalid_refs.map(function (number) { return '[' + number + ']'; }).join(' ')));
      }
      if (citations.length) card.appendChild(renderCitations(citations));
    }

    panel.appendChild(card);
    panel.classList.remove('hidden');
    if (data.refused) {
      toast('资料不足，已拒答：' + (data.refuse_reason || ''), true);
    }
  }

  async function ask(query) {
    var body = { q: query, top_k: 5 };
    // 和检索模式共用同一套集合选择：问技术问题时不会把简历带进提示词
    if (state.activeCollections.length) body.collections = state.activeCollections;
    var data = await api('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    state.lastServerMs = typeof data.elapsed_ms === 'number' ? data.elapsed_ms : null;
    state.terms = splitTerms(query);
    renderAnswer(data);

    if (data.refused) {
      // 拒答时保留检索结果入口：结果卡片照常渲染，还能打开源码 / 复制引用
      state.results = (data.hits || []).map(normalizeResult);
      state.repos = aggregateRepos(state.results);
      state.activeRepos = {};
      if (state.results.length) {
        renderFilters();
        renderResults();
      }
    }
  }

  /* ================================================================
   *  底部状态条

  function statusChip(text, tone) {

  }

  function renderStatus() {
    var bar = $('status-chips');

    if (!health) {

          ? health.n_collections
          : (health.collections || []).length;
        bar.appendChild(statusChip('集合 ' + count + ' 个'));
      }
      bar.appendChild(statusChip('embedder ' + (health.embedder || '未知')));
      bar.appendChild(statusChip(health.ready ? '就绪' : '未就绪', health.ready ? 'ok' : 'bad'));
      bar.appendChild(statusChip(health.answerer ? '问答已启用' : '问答未启用',
        health.answerer ? 'ok' : ''));
      bar.appendChild(statusChip('编辑器 ' + (health.editor || (health.raw_dir_exists === false
        ? '不可用（线上部署）' : '未探测'))));

    var elapsed = '上次查询 -';
    if (state.lastElapsed !== null) {
      elapsed = '上次查询 ' + state.lastElapsed + ' ms';
      if (state.lastServerMs !== null) {
        elapsed += '（服务端 ' + state.lastServerMs + ' ms）';
      }
    }
    bar.appendChild(statusChip(elapsed));
  }

  async function loadHealth() {
    try {
      state.health = await api('/api/health');
      state.healthError = null;
    } catch (err) {
      state.health = null;
      state.healthError = err.message;
    }
    renderStatus();

  /* ================================================================
   *  统计浮层
   * ================================================================ */

  function isStatsOpen() {
    var panel = $('stats-panel');
    return !!panel && !panel.classList.contains('hidden');
  }

  function statsPair(grid, label, value, asCode) {
    grid.appendChild(el('dt', null, label));
    var dd = el('dd');
    if (asCode) dd.appendChild(el('code', null, value));
    else dd.textContent = value == null ? '-' : String(value);
    grid.appendChild(dd);
  }

  function renderRepoTable(body, repos, total, subtitle) {
    if (!repos || !repos.length) return;
    body.appendChild(el('h3', 'stats-subtitle', subtitle));
    var table = el('table', 'stats-table');
    var thead = el('thead');
    var headRow = el('tr');
    headRow.appendChild(el('th', null, '仓库'));
    headRow.appendChild(el('th', 'num', '块数'));
    headRow.appendChild(el('th', 'num', '占比'));
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el('tbody');
    repos.forEach(function (repo) {
      var row = el('tr');
      row.appendChild(el('td', null, repo.name || UNKNOWN_REPO));
      row.appendChild(el('td', 'num', fmtInt(repo.chunks)));
      var percent = total ? (repo.chunks / total * 100) : 0;
      row.appendChild(el('td', 'num', percent.toFixed(1) + '%'));
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    body.appendChild(table);

  function renderStats(data) {
    var body = $('stats-body');
    if (!body) return;
    body.replaceChildren();

    // 顶部是所有集合的汇总
    var grid = el('dl', 'stats-grid');
    var groups = Array.isArray(data.collections) ? data.collections : [];
    statsPair(grid, '块数', fmtInt(data.chunks));
    statsPair(grid, '集合', groups.length + ' 个');
    statsPair(grid, '平均字符数', fmtInt(data.avg_chars) + ' 字符/块');
    statsPair(grid, '索引大小', fmtMb(data.index_size_mb));

    body.appendChild(grid);

      // 旧后端没有 collections 字段时保持原来的单块渲染
      renderRepoTable(body, data.repos, data.chunks, '各仓库块数');
      return;
    }

    // 每个集合一块：块数 / 平均字符 / 索引大小 / 各仓库分布
    groups.forEach(function (group) {
      var name = collectionDisplay(group.name);
      body.appendChild(el('h3', 'stats-subtitle',
        '集合 ' + name + ' · ' + fmtInt(group.chunks) + ' 块'));
      var detail = el('dl', 'stats-grid');
      statsPair(detail, '平均字符数', fmtInt(group.avg_chars) + ' 字符/块');
      statsPair(detail, '索引大小', fmtMb(group.index_size_mb));
      statsPair(detail, '索引目录', group.index_dir || '(未知)', true);
      body.appendChild(detail);
      renderRepoTable(body, group.repos, group.chunks,

  function openStats() {
    var panel = $('stats-panel');
    if (!panel) return;
    if (isReviewOpen()) closeReview();
    panel.classList.remove('hidden');
    document.body.classList.add('overlay-open');

      renderStats(state.stats);

    }

    document.body.classList.remove('overlay-open');
