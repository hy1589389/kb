  /* ================================================================
   *  今日复习
   *
   *  题目由后端按日期从「评测失败题」里挑（`/api/review/today`），前端只管
   *  请求、渲染和「先自己答，再看参考」。草稿只放在 state 里：没有用户系统，
   *  刷新就没了，比假装存过更诚实。
   * ================================================================ */

  function isReviewOpen() {
    var panel = $('review-panel');
    return !!panel && !panel.classList.contains('hidden');
  }

  function closeReview() {
    hide('review-panel');
    document.body.classList.remove('overlay-open');
  }

  /** `YYYY-MM-DD` 加天数。后端按日期取模选题目，「换一题」就是看下一天那道。 */
  function shiftDay(iso, days) {
    var parts = String(iso || '').split('-');
    if (parts.length !== 3) return '';
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if (isNaN(date.getTime())) return '';
    date.setDate(date.getDate() + days);
    return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
  }

  function openReview(day) {
    var panel = $('review-panel');
    if (!panel) return;
    if (isStatsOpen()) closeStats();
    panel.classList.remove('hidden');
    document.body.classList.add('overlay-open');
    loadReview(day || '');
  }

  function loadReview(day) {
    var body = $('review-body');
    var meta = $('review-meta');
    if (meta) meta.textContent = '';
    if (body) {
      body.replaceChildren();
      body.appendChild(el('p', 'stats-loading', '题目加载中…'));
    }
    api('/api/review/today' + (day ? '?day=' + encodeURIComponent(day) : ''))
      .then(function (data) {
        state.review = data;
        if (isReviewOpen()) renderReview(data);
      })
      .catch(function (err) {
        if (!body) return;
        body.replaceChildren();
        body.appendChild(el('p', 'meta bad',
          '复习题加载失败：' + (err && err.message ? err.message : err)));
      });
  }

  function reviewRankText(data) {
    if (typeof data.rank === 'number' && data.rank > 0) {
      return '评测第 ' + data.rank + ' 位（前 ' + data.top_k + ' 没命中）';
    }
    return '评测没进前 ' + (data.eval_top_k || data.top_k || 10);
  }

  function renderReview(data) {
    var body = $('review-body');
    var meta = $('review-meta');
    if (!body) return;
    body.replaceChildren();

    var total = Number(data.total) || 0;
    var seq = Number(data.seq) || 0;
    if (meta) {
      meta.textContent = (data.date || '') +
        (data.available && total ? ' · 第 ' + seq + '/' + total + ' 题' : '');
    }

    if (!data.available) {
      body.appendChild(el('p', 'review-question', '今天没有可复习的题目'));
      body.appendChild(el('p', 'review-hint', data.reason || '题库为空'));
      if (data.source) body.appendChild(el('p', 'review-hint', '题库文件：' + data.source));
      body.appendChild(el('p', 'review-hint',
        '生成题库：python eval\\run_eval.py --top-k 10 --out results\\run_hybrid.json'));
      return;
    }

    var tags = el('div', 'review-tags');
    if (data.category) tags.appendChild(el('span', 'review-tag', data.category));
    if (data.difficulty) tags.appendChild(el('span', 'review-tag', '难度 ' + data.difficulty));
    tags.appendChild(el('span', 'review-tag', reviewRankText(data)));
    if (data.qid) tags.appendChild(el('span', 'review-tag plain', data.qid));
    body.appendChild(tags);

    body.appendChild(el('h3', 'review-question', data.question));
    body.appendChild(el('p', 'review-hint',
      '题库是 ' + data.n_evaluated + ' 条评测里没进前 ' + data.top_k + ' 的 ' + total +
      ' 条。先自己答一遍，再看参考原文。'));

    var draft = el('textarea', 'review-answer');
    draft.rows = 4;
    draft.placeholder = '写下你的答案…（只在当前页面，不保存也不上传）';
    draft.value = state.reviewDraft || '';
    draft.addEventListener('input', function () { state.reviewDraft = draft.value; });
    body.appendChild(draft);

    var actions = el('div', 'review-actions');
    var reveal = el('button', 'primary', '我答完了，看参考');
    reveal.type = 'button';
    reveal.addEventListener('click', function () {
      var mine = draft.value;
      draft.remove();
      actions.remove();
      renderReviewReveal(data, mine, body);
    });
    actions.appendChild(reveal);

    var next = el('button', 'ghost', '换一题');
    next.type = 'button';
    next.title = '按日期轮换：看下一天轮到的那道';
    next.addEventListener('click', function () {
      state.reviewDraft = '';
      openReview(shiftDay(data.date, 1));
    });
    actions.appendChild(next);
    body.appendChild(actions);
  }

  function reviewChunkCard(item, index) {
    var card = el('article', 'review-chunk');
    var head = el('div', 'review-chunk-head');
    head.appendChild(el('span', 'rank', '#' + index));
    head.appendChild(el('span', 'review-chunk-loc', locationOf(item)));
    card.appendChild(head);

    if (item.breadcrumb) card.appendChild(el('p', 'review-chunk-crumb', item.breadcrumb));

    var text = el('div', 'review-chunk-text', item.text || '(空)');
    card.appendChild(text);

    var actions = el('div', 'review-chunk-actions');
    if (item.truncated) {
      var expanded = false;
      var toggle = el('button', 'ghost small', '展开全文');
      toggle.type = 'button';
      toggle.addEventListener('click', function () {
        expanded = !expanded;
        text.textContent = expanded ? (item.text_full || item.text || '') : (item.text || '');
        text.classList.toggle('expanded', expanded);
        toggle.textContent = expanded ? '收起' : '展开全文';
      });
      actions.appendChild(toggle);
    }
    var open = el('button', 'ghost small', '在 VS Code 打开');
    open.type = 'button';
    open.addEventListener('click', function () { openInEditor(item, open); });
    if (editorAvailable()) actions.appendChild(open);
    card.appendChild(actions);
    return card;
  }

  function renderReviewReveal(data, answer, body) {
    var mine = String(answer || '').trim();
    var yourSection = el('section', 'review-section');
    yourSection.appendChild(el('h4', 'review-section-title', '你的回答'));
    yourSection.appendChild(mine
      ? el('p', 'review-your-answer', mine)
      : el('p', 'review-hint', '（没写，直接看了答案）'));
    body.appendChild(yourSection);

    var chunks = Array.isArray(data.chunks) ? data.chunks : [];
    var refSection = el('section', 'review-section');
    refSection.appendChild(el('h4', 'review-section-title',
      data.chunks_source === 'search'
        ? '参考原文（现检索结果：评测标注的块 id 对不上当前索引）'
        : '参考原文（评测标注的正确段落）'));
    if (chunks.length) {
      chunks.forEach(function (item, index) {
        refSection.appendChild(reviewChunkCard(item, index + 1));
      });
    } else {
      refSection.appendChild(el('p', 'review-hint', '没有取到原文：索引里找不到对应的块。'));
    }
    body.appendChild(refSection);

    var answerSection = el('section', 'review-section');
    answerSection.appendChild(el('h4', 'review-section-title', '参考答案'));
    var slot = el('div');
    var noAnswerer = state.health && state.health.answerer === false;
    var askButton = el('button', 'ghost small', '生成参考答案');
    askButton.type = 'button';
    if (noAnswerer) {
      askButton.disabled = true;
      askButton.title = '启动时没有可用的模型客户端（检查 DEEPSEEK_API_KEY）';
      slot.appendChild(el('p', 'review-hint', '没配置模型 key，只能看上面的原文。'));
    }
    askButton.addEventListener('click', function () { reviewAsk(data, slot, askButton); });
    slot.appendChild(askButton);
    answerSection.appendChild(slot);
    body.appendChild(answerSection);
  }

  async function reviewAsk(data, slot, button) {
    var label = button.textContent;
    button.disabled = true;
    button.textContent = '生成中…';
    try {
      var result = await api('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ q: data.question, top_k: 5 })
      });
      var wrap = el('div', 'answer-body');
      renderAnswerText(wrap, result.text || '', 0);
      slot.replaceChildren(wrap);
      slot.appendChild(el('p', 'review-hint',
        result.refused
          ? '模型认为资料不足，上面的原文仍然可以看。'
          : '由 ' + (result.model || '模型') + ' 基于检索到的原文生成，以原文为准。'));
      var citations = result.citations || [];
      if (citations.length) {
        var list = el('div', 'review-citations');
        list.appendChild(el('div', null, '引用：'));
        citations.forEach(function (citation) {
          var line = (citation.repo ? citation.repo + '/' : '') + citation.rel_path;
          if (citation.line_start) line += ':' + citation.line_start;
          list.appendChild(el('div', 'review-cite', '[' + citation.ref + '] ' + line));
        });
        slot.appendChild(list);
      }
    } catch (err) {
      slot.replaceChildren();
      slot.appendChild(el('p', 'meta bad', '生成失败：' + err.message));
    } finally {
      button.disabled = false;
      button.textContent = label;
    }
  }

  /* ================================================================
   *  键盘快捷键
   * ================================================================ */

  function isTypingTarget(target) {
    if (!target) return false;
    var tag = target.tagName ? target.tagName.toLowerCase() : '';
    return tag === 'input' || tag === 'textarea' || tag === 'select' ||
      target.isContentEditable === true;
  }

  function selectCard(index) {
    var cards = document.querySelectorAll('#results .card');
    if (!cards.length) return;
    if (index < 0) index = 0;
    if (index >= cards.length) index = cards.length - 1;
    state.selected = index;
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle('selected', i === index);
    }
    if (cards[index].scrollIntoView) {
      cards[index].scrollIntoView({ block: 'nearest' });
    }
  }

  function moveSelection(delta) {
    if (!state.visible.length) return;
    if (state.selected < 0) {
      selectCard(delta > 0 ? 0 : state.visible.length - 1);
      return;
    }
    selectCard(state.selected + delta);
  }

  function openSelected() {
    if (state.selected < 0) return;
    // 线上没有编辑器，回车打开源码这条快捷键没有意义
    if (!editorAvailable()) return;
    var item = state.visible[state.selected];
    if (!item) return;
    var cards = document.querySelectorAll('#results .card');
    var card = cards[state.selected];
    var button = card ? card.querySelector('button[data-action="open"]') : null;
    openInEditor(item, button);
  }

  function onKeydown(event) {
    if (event.defaultPrevented) return;

    // `/`：不在输入框里时聚焦搜索框（输入框里要能正常输入斜杠）
    if (event.key === '/' && !isTypingTarget(event.target)) {
      event.preventDefault();
      var input = $('query-input');
      if (input) {
        input.focus();
        openHistory();
      }
      return;
    }

    // Esc：先关最上层浮层；都没有时清空输入并失焦
    if (event.key === 'Escape') {
      if (isReviewOpen()) { closeReview(); return; }
      if (isStatsOpen()) { closeStats(); return; }
      if (state.historyOpen) { closeHistory(); return; }
      var box = $('query-input');
      if (box) {
        box.value = '';
        box.blur();
      }
      closeHistory();
      return;
    }

    if (isTypingTarget(event.target)) return;

    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      var results = $('results');
      if (!results || results.classList.contains('hidden') || !state.visible.length) return;
      event.preventDefault();
      moveSelection(event.key === 'ArrowDown' ? 1 : -1);
      return;
    }

    if (event.key === 'Enter' && state.selected >= 0) {
      // 焦点在按钮上时 Enter 是「按这个按钮」，不能再抢去打开结果
      var tag = event.target && event.target.tagName
        ? event.target.tagName.toLowerCase()
        : '';
      if (tag === 'button' || tag === 'a') return;
      event.preventDefault();
      openSelected();
    }
  }

  function onDocumentMousedown(event) {
    if (!state.historyOpen) return;
    var target = event.target;
    var panel = $('history-panel');
    var input = $('query-input');
    if (panel && target && panel.contains(target)) return;
    if (input && target && (target === input || input.contains(target))) return;
    closeHistory();
  }

  /* ================================================================
   *  主流程
   * ================================================================ */

  function emptyTitleForMode() {
    return state.mode === 'search' ? DEFAULT_EMPTY : '输入问题后回车，答案会带引用';
  }

  function applyMode(mode) {
    state.mode = mode === 'ask' ? 'ask' : 'search';
    var searchTab = $('mode-search');
    var askTab = $('mode-ask');
    var input = $('query-input');
    if (searchTab) {
      searchTab.classList.toggle('active', state.mode === 'search');
      searchTab.setAttribute('aria-selected', state.mode === 'search' ? 'true' : 'false');
    }
    if (askTab) {
      askTab.classList.toggle('active', state.mode === 'ask');
      askTab.setAttribute('aria-selected', state.mode === 'ask' ? 'true' : 'false');
    }
    if (input) {
      input.placeholder = state.mode === 'search'
        ? '输入关键词…'
        : '输入问题，例如：RAG 是什么';
    }
    // 问答模式不支持按集合过滤，提示文案跟着模式走
    renderCollectionChips();
  }

  function setMode(mode) {
    if (state.busy) return;
    applyMode(mode);
    closeHistory();
    resetOutput();
    showEmpty(emptyTitleForMode(), state.mode === 'search' ? TIPS_SEARCH : TIPS_ASK);
    var input = $('query-input');
    if (input) input.focus();
  }

  async function run() {
    if (state.busy) return;
    var input = $('query-input');
    var query = input ? input.value.trim() : '';

    if (!query) {
      // 空输入不发请求：聚焦 + 提示
      resetOutput();
      showEmpty('请输入查询词后再搜索', TIPS_SEARCH);
      if (input) input.focus();
      toast('请输入查询词', true);
      return;
    }

    var mode = state.mode;
    var started = performance.now();
    state.lastElapsed = null;
    state.lastServerMs = null;
    state.lastQuery = query;

    closeHistory();
    resetOutput();
    setBusy(true);
    showLoading();
    syncUrl(query, mode);
    addHistory(query, mode);

    try {
      if (mode === 'ask') await ask(query);
      else await search(query);
    } catch (err) {
      showError(err && err.message ? err.message : String(err));
    } finally {
      state.lastElapsed = Math.round(performance.now() - started);
      setBusy(false);
      hide('loading');
      renderStatus();
    }
  }

  /* ================================================================
   *  绑定与启动
   * ================================================================ */

  function bindEvents() {
    on('mode-search', 'click', function () { setMode('search'); });
    on('mode-ask', 'click', function () { setMode('ask'); });
    on('search-btn', 'click', run);
    on('retry-btn', 'click', run);
    on('theme-toggle', 'click', cycleTheme);
    on('rerank-toggle', 'click', toggleRerank);

    on('stats-btn', 'click', function () {
      if (isStatsOpen()) closeStats();
      else openStats();
    });
    on('stats-close', 'click', closeStats);
    var overlay = $('stats-panel');
    if (overlay) {
      overlay.addEventListener('click', function (event) {
        if (event.target === overlay) closeStats();
      });
    }

    on('review-btn', 'click', function () { openReview(''); });
    on('review-close', 'click', closeReview);
    var reviewPanel = $('review-panel');
    if (reviewPanel) {
      reviewPanel.addEventListener('click', function (event) {
        if (event.target === reviewPanel) closeReview();
      });
    }

    on('history-clear', 'click', clearHistory);

    on('query-input', 'focus', function () { openHistory(); });
    on('query-input', 'input', function () {
      var input = $('query-input');
      if (input && input.value.trim()) openHistory();
      else closeHistory();
    });
    on('query-input', 'keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        run();
      }
    });

    document.addEventListener('keydown', onKeydown);
    document.addEventListener('mousedown', onDocumentMousedown);
  }

  async function boot() {
    state.theme = loadTheme();
    applyTheme();
    watchSystemTheme();
    state.rerank = loadRerank();
    applyRerank();
    bindEvents();
    loadHealth();
    // 集合列表要先拿到：chip 的默认选中和「存的集合还在不在」都靠它
    await loadCollections();

    var input = $('query-input');
    var initial = readUrlState();
    if (initial.collections && initial.collections.length) {
      applyCollections(initial.collections);   // 刷新 / 分享链接能恢复集合选择
    }
    if (initial.q) {
      if (input) input.value = initial.q;
      applyMode(initial.mode);
      run();                       // 刷新 / 分享链接后自动复现这次查询
    } else if (input) {
      input.focus();
    }
  }

  boot();
})();
</script>
</body>
</html>
